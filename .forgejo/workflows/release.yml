name: release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1
    steps:
      - name: Checkout code
        # the remote is the source of truth
        run: |
          git init -b main .
          git remote add origin https://codeberg.org/rvhonorato/gdock.git
          git fetch --depth 1 origin "$GITHUB_SHA"
          git -c advice.detachedHead=false checkout FETCH_HEAD

      - name: Tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo pkgid -p gdock | sed -E 's/.*[#@:]//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      # Build all the packages first. A publish cannot be undone.
      - name: Build the crate
        run: cargo package -p gdock

      - name: Install the Python build tools
        # zig is the linker for the cross builds
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /opt/tools
          /opt/tools/bin/pip install maturin ziglang twine
          echo "/opt/tools/bin" >> "$GITHUB_PATH"

      - name: Build the Python source distribution
        working-directory: py
        run: maturin sdist --out dist

      - name: Build the Python wheels
        working-directory: py
        env:
          TARGETS: >-
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-apple-darwin
          PYTHONS: "3.11 3.12 3.13 3.14 3.15"
        run: |
          rustup target add $TARGETS
          interpreters=""
          for v in $PYTHONS; do
            interpreters="$interpreters -i python$v"
          done
          for target in $TARGETS; do
            maturin build --release --zig --target "$target" $interpreters --out dist
          done
          twine check dist/*

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --non-interactive py/dist/*

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p gdock

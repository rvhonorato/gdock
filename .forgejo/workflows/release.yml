name: release

# Push a tag like v2.3.0 to publish the crate and the Python package.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: codeberg-medium
    container:
      image: docker.io/library/rust:1
    steps:
      - name: Checkout code
        # the remote is the source of truth
        run: |
          git init -b main .
          git remote add origin https://codeberg.org/rvhonorato/gdock.git
          git fetch --depth 1 origin "$GITHUB_SHA"
          git -c advice.detachedHead=false checkout FETCH_HEAD

      - name: Tag must match the workspace version
        run: |
          version=$(cargo pkgid -p gdock | sed -E 's/.*[#@:]//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      # Build the two packages first. A publish cannot be undone.
      - name: Build the crate
        run: cargo package -p gdock

      - name: Build the Python source distribution
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-venv
          python3 -m venv /opt/tools
          /opt/tools/bin/pip install maturin
          cd py
          /opt/tools/bin/maturin sdist --out dist

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p gdock

      - name: Publish to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: /opt/tools/bin/maturin upload py/dist/*

      - name: Create the Codeberg release
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) pre=true ;;
            *) pre=false ;;
          esac
          curl --fail-with-body -sS -X POST \
            -H "Authorization: token ${CODEBERG_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\",\"prerelease\":$pre}" \
            https://codeberg.org/api/v1/repos/rvhonorato/gdock/releases

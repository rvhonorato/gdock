[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "gdock"
dynamic = ["version"]
description = "Information-driven protein-protein docking using a genetic algorithm - Python bindings"
readme = "../README.md"
license = "0BSD"
requires-python = ">=3.11"
keywords = [
  "bioinformatics",
  "protein",
  "docking",
  "structural-biology",
  "genetic-algorithm",
]
authors = [{ name = "Rodrigo V. Honorato", email = "email@rvhonorato.me" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://gdock.org"
Repository = "https://codeberg.org/rvhonorato/gdock"
Issues = "https://codeberg.org/rvhonorato/gdock/issues"
Changelog = "https://codeberg.org/rvhonorato/gdock/releases"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "gdock._internal"
